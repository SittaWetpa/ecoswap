name: CI/CD

# Triggers:
# - Every push to any branch: catches breakage before PR is opened
# - Every PR to main: gates merges
# - Integration test and deploy run ONLY on push to main (slower / costlier jobs)

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same ref when a new push lands
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'
  NODE_VERSION: '20'
  JAVA_VERSION: '21'

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1. Flutter analyze + unit/widget tests
  # ─────────────────────────────────────────────────────────────────
  flutter-analyze-and-test:
    name: Flutter — analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run unit and widget tests
        run: flutter test --coverage

      - name: Upload coverage as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # 2. Cloud Functions build + unit tests
  # ─────────────────────────────────────────────────────────────────
  functions-build-and-test:
    name: Cloud Functions — build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript compile check
        run: npm run build

      - name: Unit tests (Jest)
        run: npm run test:ci

      - name: Upload coverage as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functions-coverage
          path: functions/coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # 3. Firestore security rules tests against the emulator
  # ─────────────────────────────────────────────────────────────────
  firestore-rules-test:
    name: Firestore rules — emulator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install rules test dependencies
        working-directory: functions
        run: npm ci

      - name: Run rules tests against emulator
        # Starts the Firestore emulator, runs the rules tests, tears down
        run: |
          firebase emulators:exec \
            --only firestore \
            --project ecoswap-ci \
            "cd functions && npm run test:rules"

  # ─────────────────────────────────────────────────────────────────
  # 4. End-to-end integration test (WBS 12.1)
  # Only on PR to main and push to main — too slow for every branch push
  # ─────────────────────────────────────────────────────────────────
  integration-test:
    name: Integration test (WBS 12.1)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: [flutter-analyze-and-test, functions-build-and-test]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Cloud Functions
        working-directory: functions
        run: |
          npm ci
          npm run build

      - name: Run integration test against emulator suite
        run: |
          firebase emulators:exec \
            --only auth,firestore,functions,storage \
            --project ecoswap-ci \
            "flutter test integration_test/full_flow_test.dart"

  # ─────────────────────────────────────────────────────────────────
  # 5. Build debug APK as artifact — on every PR and push to main
  # Lets the team install the latest build without a working Flutter SDK locally
  # ─────────────────────────────────────────────────────────────────
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: [flutter-analyze-and-test]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        # DEV_MODE=false explicitly — never ship a debug APK with the paste path enabled
        run: flutter build apk --debug --dart-define=DEV_MODE=false

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecoswap-debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────
  # 6. Deploy Cloud Functions + Firestore rules to dev project
  # Only on push to main, after all tests pass
  # ─────────────────────────────────────────────────────────────────
  deploy-dev:
    name: Deploy to dev Firebase
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [flutter-analyze-and-test, functions-build-and-test, firestore-rules-test, integration-test]
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Build Cloud Functions
        working-directory: functions
        run: |
          npm ci
          npm run build

      - name: Deploy to dev project
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy \
            --only functions,firestore:rules,storage:rules \
            --project ecoswap-dev \
            --token "$FIREBASE_TOKEN" \
            --non-interactive

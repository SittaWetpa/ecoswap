name: CI/CD

# Triggers:
# - Every push to any branch: catches breakage before PR is opened
# - Every PR to main: gates merges
# - Integration test and deploy run ONLY on push to main (slower / costlier jobs)

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same ref when a new push lands
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'
  NODE_VERSION: '20'
  JAVA_VERSION: '21'

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1. Flutter analyze + unit/widget tests
  # ─────────────────────────────────────────────────────────────────
  flutter-analyze-and-test:
    name: Flutter — analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run unit and widget tests
        run: flutter test --coverage

      - name: Upload coverage as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # 2. Cloud Functions build + unit tests
  # ─────────────────────────────────────────────────────────────────
  functions-build-and-test:
    name: Cloud Functions — build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript compile check
        run: npm run build

      - name: Unit tests (Jest)
        run: npm run test:ci

      - name: Upload coverage as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functions-coverage
          path: functions/coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # 3. Firestore security rules tests against the emulator
  # ─────────────────────────────────────────────────────────────────
  firestore-rules-test:
    name: Firestore rules — emulator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install rules test dependencies
        working-directory: functions
        run: npm ci

      - name: Run rules tests against emulator
        # Starts the Firestore + Storage emulators, runs the rules tests, tears down.
        # Uses test:rules:ci (plain jest, no nested emulators:exec) to avoid port
        # conflicts that would occur if test:rules were called here instead.
        run: |
          firebase emulators:exec \
            --only firestore,storage \
            --project demo-ecoswap \
            "cd functions && npm run test:rules:ci"

  # ─────────────────────────────────────────────────────────────────
  # 4. End-to-end integration test (WBS 12.1) — DISABLED for now
  #
  # This previously ran `flutter test -d linux integration_test/` against the
  # emulator suite. It was removed because the project targets Android only at
  # this stage, and the Linux-desktop runner was only ever a stand-in — it
  # needed the native GTK/CMake toolchain plus a headless display (xvfb) just
  # to launch, none of which reflects how the app actually ships.
  #
  # The integration_test/ Dart suites are kept in the repo. When integration
  # coverage is back in scope, reintroduce WBS 12.1 as an Android job using an
  # emulator action (e.g. reactivecircus/android-emulator-runner) and add it
  # back to deploy-dev's `needs`.
  # ─────────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────────
  # 5. Build debug APK as artifact — on every PR and push to main
  # Lets the team install the latest build without a working Flutter SDK locally
  # ─────────────────────────────────────────────────────────────────
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: [flutter-analyze-and-test]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: flutter pub get

      - name: Materialize google-services.json from secret
        # google-services.json is .gitignore'd (Firebase config; project-specific).
        # The owner must set GOOGLE_SERVICES_JSON_B64 once in repo secrets:
        #   base64 google-services.json | tr -d '\n'  →  paste as secret value.
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GS_B64" ]; then
            echo "::error::Repo secret GOOGLE_SERVICES_JSON_B64 is not set."
            echo "Owner: download google-services.json from the Firebase Console"
            echo "(Project Settings → Your apps → Android), then run"
            echo "'base64 google-services.json | tr -d \"\\n\"' and paste the"
            echo "result into a repo secret named GOOGLE_SERVICES_JSON_B64."
            exit 1
          fi
          echo "$GS_B64" | base64 -d > android/app/google-services.json

      - name: Build debug APK
        # DEV_MODE=false explicitly — never ship a debug APK with the paste path enabled
        run: flutter build apk --debug --dart-define=DEV_MODE=false

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecoswap-debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────
  # 6. Deploy Cloud Functions + Firestore rules to dev project
  # Only on push to main, after all tests pass
  # ─────────────────────────────────────────────────────────────────
  deploy-dev:
    name: Deploy to dev Firebase
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [flutter-analyze-and-test, functions-build-and-test, firestore-rules-test]
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Build Cloud Functions
        working-directory: functions
        run: |
          npm ci
          npm run build

      - name: Deploy to dev project
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy \
            --only functions,firestore:rules,storage \
            --project ecoswap-dev-kmutt \
            --token "$FIREBASE_TOKEN" \
            --non-interactive

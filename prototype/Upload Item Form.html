<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EcoSwap — Upload Item</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --green-primary: #1D9E75;
    --green-dark: #0F6E56;
    --green-soft: #E1F5EE;
    --surface: #FFFFFF;
    --surface-alt: #F7F5F0;
    --border: #E5E5E0;
    --text-primary: #1A1A1A;
    --text-secondary: #6B6B66;
    --text-tertiary: #A0A09B;
    --danger: #C44545;
    --danger-soft: #FCEBEB;
    --warning: #BA7517;
    --info: #185FA5;
    --shadow-card: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-modal: 0 8px 24px rgba(0,0,0,0.12);
    --density: 1;
  }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #ECEAE3;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; }
  .phone-scroll::-webkit-scrollbar { display: none; }
  .phone-scroll { scrollbar-width: none; }

  #stage {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 48px 24px 64px;
  }
  .canvas-title {
    font-size: 13px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-tertiary); margin-bottom: 8px;
  }
  .canvas-h1 {
    font-size: 28px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 8px;
  }
  .canvas-sub {
    font-size: 15px; color: var(--text-secondary); margin: 0 0 40px; max-width: 720px; line-height: 1.5;
  }
  .frames-row {
    display: flex; gap: 64px; justify-content: center; align-items: flex-start; flex-wrap: wrap;
  }
  .frame-col {
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .frame-label-block {
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px; width: 410px;
  }
  .frame-tag {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-tertiary);
  }
  .frame-name {
    font-size: 18px; font-weight: 600; color: var(--text-primary);
  }
  .frame-desc {
    font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-top: 4px;
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="canvas-title">Inventory · Add flow</div>
    <h1 class="canvas-h1">Add item — Empty state &amp; Filled example</h1>
    <p class="canvas-sub">User has tapped the floating "+" on My items and lands on this scrollable, modal-style form. Top bar and submit are sticky; the seven fields scroll between them. The filled frame shows a sample leather tote bag entry.</p>
    <div id="root"></div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="src/android-frame.jsx"></script>
  <script type="text/babel" src="src/data.jsx"></script>
  <script type="text/babel" src="src/icons.jsx"></script>
  <script type="text/babel" src="src/ui.jsx"></script>
  <script type="text/babel" src="src/screens/upload.jsx"></script>

  <script type="text/babel">
    const { PhoneFrame, UploadItemScreen } = window;

    const App = () => (
      <div className="frames-row">
        <div className="frame-col">
          <div className="frame-label-block">
            <div className="frame-tag">State A</div>
            <div className="frame-name">Empty</div>
            <div className="frame-desc">Initial state right after tapping "+". Placeholders in every field, no condition selected, submit disabled.</div>
          </div>
          <PhoneFrame>
            <UploadItemScreen filled={false} />
          </PhoneFrame>
        </div>
        <div className="frame-col">
          <div className="frame-label-block">
            <div className="frame-tag">State B</div>
            <div className="frame-name">Filled · sample item</div>
            <div className="frame-desc">A leather tote bag entry — photo set, category and condition chosen, weight overridden, both descriptions written. Submit enabled.</div>
          </div>
          <PhoneFrame>
            <UploadItemScreen filled={true} />
          </PhoneFrame>
        </div>
      </div>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

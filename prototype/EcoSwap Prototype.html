<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EcoSwap — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --green-primary: #1D9E75;
    --green-dark: #0F6E56;
    --green-soft: #E1F5EE;
    --surface: #FFFFFF;
    --surface-alt: #F7F5F0;
    --border: #E5E5E0;
    --text-primary: #1A1A1A;
    --text-secondary: #6B6B66;
    --text-tertiary: #A0A09B;
    --danger: #C44545;
    --danger-soft: #FCEBEB;
    --warning: #BA7517;
    --info: #185FA5;
    --shadow-card: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-modal: 0 8px 24px rgba(0,0,0,0.12);
    --density: 1;
  }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #ECEAE3;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; }
  /* hide scrollbars inside phone */
  .phone-scroll::-webkit-scrollbar { display: none; }
  .phone-scroll { scrollbar-width: none; }

  /* Stage */
  #stage {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 16px;
  }
</style>
</head>
<body>
  <div id="stage"><div id="root"></div></div>

  <script type="text/babel" src="src/android-frame.jsx"></script>
